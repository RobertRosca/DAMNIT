# Alembic configuration for DAMNIT's Postgres schema.
[alembic]
script_location = damnit/backend/db/alembic
file_template = %%(year)04d%%(month)02d%%(day)02d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
# The URL is resolved at runtime in env.py from the DAMNIT_DATABASE_URL env var.
sqlalchemy.url = postgresql+psycopg://damnit@localhost/damnit

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
